name: storage-and-sharing-services

services:
  storage-and-sharing-services:
    build:
      context: .
    container_name: storage-and-sharing-services
    restart: "no"
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8084}:8084"
    environment:
      HOST: 0.0.0.0
      PORT: 8084
      UPLOAD_DIR: /data/received
      DOWNLOAD_DIR: /data/available
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-1024}"
    volumes:
      - type: bind
        source: ./shared/received
        target: /data/received
      - type: bind
        source: ./shared/available
        target: /data/available
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
